# RLTT baseline (Williams & Tureci 2026, arXiv 2602.10520), paper Table 6 settings, except data
# and lengths, which follow SAPD (as in grpo_baseline_8gpu.yaml): DeepMath-103K level >= 6 with
# its own prompt, prompts up to 2,048 tokens, generations up to 16,384 (paper: MATH, 1,024 / 2,048),
# and the gradient accumulation: 1, one update per 32-prompt step (paper: 2).
# RLTT member of the 2.6B comparison group with grpo_baseline_8gpu.yaml (see CLAUDE.md): the two
# files share every setting that is not the method itself; the test
# tests/test_rltt_baseline.py::test_matched_configs_share_all_non_method_settings enforces this.
# The 1.4B group is rltt_baseline_1p4b_8gpu.yaml; the two groups differ only in the model.
# Launcher: python -m rltt_baseline.launch --config <this file> [overrides]
# Overrides use dot-list syntax, e.g. args.learning_rate=2e-6 wandb.mode=online
# Values follow RLTT rltt_experiments/run_rltt.slurm and the paper's Table 6. Paths come from
# environment variables so the same file works on any cluster.

trainer: rltt

args:  # keys = dest names of the vendor rltt_train.py argparse options
  # model: Ouro-2.6B-Thinking, full-parameter, fixed 4 loops
  model_path: ${oc.env:LOOPRL_OURO_DIR}
  use_rltt_model: true
  rltt_model_path: ${oc.env:LOOPRL_MODEL_DIR}        # built by rltt_baseline.prepare_model
  rltt_logprob_chunk_size: 2048
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true
  no_gradient_checkpointing: false                   # GRPO script: checkpointing always on
  ref_offload: true                                  # GRPO config: ref.fsdp_config.param_offload

  # data: SAPD math training set (deepmath_level6.parquet), prompts used unchanged;
  # MATH-500 for optional validation
  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048
  max_completion_length: 16384

  # RLTT objective
  loop_weighting: exit_pdf      # uniform | progressive | exit_pdf | learned
  progressive_alpha: 1.0
  beta: 0.0                     # KL off (verl_overrides: use_kl_loss false, kl_loss_coef 0)
  num_generations: 8
  num_prompts_per_batch: 32
  temperature: 1.0

  # optimisation
  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: constant   # grpo_train.py hard-codes constant
  gradient_accumulation_steps: 1  # one optimizer update per 32-prompt step (as the 1.4B group)
  num_train_epochs: 5
  max_steps: 140                # paper Table 6; one step = one update; -1 = run all epochs
  seed: 42

  # memory / rollout
  ppo_max_token_len: 32768      # must be >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  # resources and outputs
  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 10
  logging_steps: 1

  # validation (off in the paper runs; the paper validates MATH-500 at 3,072 tokens, the GRPO
  # config uses the generation length, kept identical here)
  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

wandb:
  enabled: true
  mode: offline                 # compute nodes: offline, then `wandb sync` from a login node
  project: rltt-ouro-baseline
  entity: null
  run_name: null                # null = vendor name RLTT-<model>-<loop_weighting>
  tags: [rltt, baseline, ouro-2.6b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

# Any verl key, merged last. The vendor script differs from the paper in two places:
# - it sets data.train_batch_size = num_prompts_per_batch x num_generations (256), which verl
#   reads as a prompt count, and ppo_mini_batch_size = min(128, that);
# - Adam betas are (0.9, 0.999); Table 6 lists (0.9, 0.99).
verl_overrides:
  data:
    seed: ${args.seed}          # dataloader shuffle seed; verl default null ignores args.seed
    train_batch_size: 32        # prompts per rollout batch -> 32 x 8 = 256 rollouts
  actor_rollout_ref:
    actor:
      ppo_mini_batch_size: 32   # = the 32 prompts of one step -> one update per step
      use_kl_loss: false        # KL loss disabled in every config of the comparison groups
      kl_loss_coef: 0.0
      optim:
        betas: [0.9, 0.99]
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]  # hf_model: loadable by the probe
  trainer:
    logger: [wandb, console]

rollout:
  # full: stock vLLM (one KV cache per loop). decode_last: prompts keep every loop's KV,
  # generated tokens keep only the last loop's (rltt_baseline.vllm_decode_last); verl then also
  # logs the rollout / training log-prob mismatch. Training forwards always use the full KV.
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 48         # Ouro-2.6B-Thinking (1.4B: 24); checked against config.json

audit:
  # Per-loop token distributions on every response token (rltt_baseline.loop_audit), written to
  # <output_dir>/audit/step_<step>/. Off by default: about 220 bytes per token before compression.
  loop_distribution:
    enabled: false
    every_n_steps: 1    # audited steps: 1, 1 + n, 1 + 2n, ...
    top_k: 5
    save_tokens: true   # false keeps summary.json and responses.jsonl, not the per-token arrays
    chunk_tokens: 512   # response tokens per lm_head call; lower it if the audit runs out of memory
