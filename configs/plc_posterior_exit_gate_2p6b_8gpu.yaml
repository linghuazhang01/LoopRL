# PLC (Posterior Loop Credit) on Ouro-2.6B-Thinking: gamma = 1, lam = 1, exit-gate prior, gate loss on.
# One node with 8 GPUs, one optimizer update per step. PLC member of the 2.6B comparison group
# (grpo_baseline_8gpu.yaml / rltt_baseline.yaml, see CLAUDE.md). Copy of
# plc_posterior_exit_gate_1p4b_8gpu.yaml that differs only in the model (num_hidden_layers 48).
#
# Objective (rltt_baseline.plc): the RLTT per-loop objective with token x loop weights
#   w[j, t] = softmax_t(log q_t + gamma * log P_old^(t)(y_j)),   q = the model's exit distribution
# (gamma = 1: exact posterior of the exit mixture; gamma = 0 would be RLTT-exit), lam = 1 (no extra
# final-loop GRPO term), plus the gate loss
#   gate_coef * A * CE(sg[w], q_new) - gate_entropy_coef * H(q_new)
# (gate_entropy_coef 0.05 = Ouro's last-stage entropy coefficient). KL loss is disabled.
# The gate loss needs an RLTT model directory built WITHOUT --detach-exit-pdf (the launcher checks
# config.json); build it with `bash scripts/prepare_model.sh <models dir>` (2.6B is the default).
#
# Data and lengths follow SAPD (DeepMath-103K level >= 6, prompts <= 2,048, generations <= 16,384)
# like the other configs here; training uses only the 14,684-row merged filtered subset
# (AGENTS.md rule 1), and the launcher refuses any other training file.
# Optimisation follows RLTT Table 6 apart from the accumulation (1 here, paper 2): 140 steps =
# 140 updates, lr 1e-6 constant + 10% warmup, betas (0.9, 0.99),
# weight decay 0.1, grad clip 0.1, KL loss off, BF16, binary reward, group-normalised advantage.
# Launch: python -m rltt_baseline.launch --config <this file> [dot-list overrides]
# Ablations by override, e.g. plc.gamma=0 (RLTT-exit), plc.lam=0 (GRPO), plc.use_gate_loss=false,
#   plc.prior=uniform plc.use_gate_loss=false (PLC-uniform), plc.use_is_correction=true.

trainer: rltt

args:  # keys = dest names of the vendor rltt_train.py argparse options
  model_path: ${oc.env:LOOPRL_OURO_DIR}
  use_rltt_model: true
  rltt_model_path: ${oc.env:LOOPRL_MODEL_DIR}        # built by rltt_baseline.prepare_model (2.6B)
  rltt_logprob_chunk_size: 2048
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true
  no_gradient_checkpointing: false
  ref_offload: true

  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048
  max_completion_length: 16384

  # vendor loop weighting is replaced by the plc section below; exit_pdf keeps the vendor's
  # run name and logging consistent with the prior used here
  loop_weighting: exit_pdf
  progressive_alpha: 1.0
  beta: 0.0                     # KL off (verl_overrides: use_kl_loss false, kl_loss_coef 0)
  num_generations: 8
  num_prompts_per_batch: 32
  temperature: 1.0

  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: constant
  gradient_accumulation_steps: 1  # one optimizer update per 32-prompt step
  num_train_epochs: 5
  max_steps: 140
  seed: 42

  ppo_max_token_len: 32768      # >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 10
  logging_steps: 1

  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

plc:
  enabled: true
  weight_mode: posterior        # posterior | rltt
  prior: exit                   # uniform | progressive | exit (the gate)
  progressive_alpha: 1.0
  gamma: 1.0                    # 0 = RLTT with the same prior
  lam: 1.0                      # 0 = GRPO (final loop only)
  eps_floor: 0.0
  use_gate_loss: true           # needs prior: exit and a model dir without --detach-exit-pdf
  gate_coef: 1.0
  gate_entropy_coef: 0.05       # Ouro Stage I entropy regulariser, last-stage value
  use_is_correction: false
  is_clip: 5.0
  log_weight_stats: true

wandb:
  enabled: true
  mode: online                  # required (AGENTS.md); WANDB_API_KEY comes from env.local
  project: looprl-ouro            # one wandb project for every method and size
  entity: null
  run_name: plc-posterior-exit-gate-2p6b
  tags: [plc, posterior, exit-prior, gate-loss, ouro-2.6b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

verl_overrides:
  data:
    seed: ${args.seed}          # dataloader shuffle seed; verl default null ignores args.seed
    train_batch_size: 32        # prompts per rollout batch -> 32 x 8 = 256 rollouts
  actor_rollout_ref:
    rollout:
      max_num_batched_tokens: 32768  # vLLM tokens per scheduler step; verl default 8192 is
                                     # below max_model_len 18,432, which verl refuses with
                                     # chunked prefill on (both vendor scripts turn it on)
      # sampling and engine settings written out (verl 0.6.1 defaults, same for every method)
      top_p: 1.0                     # no nucleus truncation
      top_k: -1                      # no top-k truncation
      do_sample: true                # sample at args.temperature, not greedy
      ignore_eos: false              # stop at EOS
      max_num_seqs: 1024             # vLLM concurrent sequences cap
      dtype: bfloat16                # vLLM weights / activations
    actor:
      ppo_mini_batch_size: 32   # = the 32 prompts of one step -> one update per step
      use_kl_loss: false        # KL loss disabled in every config of the comparison groups
      kl_loss_coef: 0.0
      optim:
        betas: [0.9, 0.99]
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]
  trainer:
    logger: [wandb, console]

rollout:
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 48         # Ouro-2.6B-Thinking (1.4B: 24); checked against config.json

audit:
  # Per-loop token distributions on every response token (rltt_baseline.loop_audit), written to
  # <output_dir>/audit/step_<step>/. On in every config of the comparison groups (shared key):
  # read-only, no extra forward (hooks the compute_log_prob pass), so the loss is unchanged; it
  # costs an lm_head call per loop on the response tokens and about 220 bytes per token on disk
  # before compression.
  loop_distribution:
    enabled: true
    every_n_steps: 1    # audited steps: 1, 1 + n, 1 + 2n, ...
    top_k: 5
    save_tokens: true   # false keeps summary.json and responses.jsonl, not the per-token arrays
    chunk_tokens: 512   # response tokens per lm_head call; lower it if the audit runs out of memory
