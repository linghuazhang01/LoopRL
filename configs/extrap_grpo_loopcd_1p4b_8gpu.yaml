# EP-GRPO on Ouro-1.4B-Thinking: on-policy GRPO on the extrapolated (LoopCD) policy, w = 0.5.
# Saved at the user's request (2026-11-19). The 1.4B comparison group: it differs from
# grpo_baseline_1p4b_8gpu.yaml, rltt_baseline_1p4b_8gpu.yaml and the PLC configs only in the
# method (trainer, extrap, loss_agg sections, wandb naming; tests/test_rltt_baseline.py checks
# this; args.loop_weighting uniform only names the vendor run). No 2.6B copy.
#
# Why: LoopCD (Liu et al., arXiv 2610.02185) decodes Ouro better without training by
# extrapolating the last loop away from the first, p' ∝ P^(4) (P^(4) / P^(1))^w. Here training
# optimizes that decoding policy directly: vLLM samples the rollouts from it and the loss is plain
# GRPO on it, so the update is on-policy (no cross-loop drift, unlike RLTT / PLC's earlier-loop
# terms). Design: research/extrapolated_rl_loss_design_2026-11-19.md.
#
# Objective (rltt_baseline.extrap):
#   pi_w = softmax( ((1 + w) log P^(4) - w sg[log P^(1)]) / temperature )   (temperature 1)
#   loss = -seq-mean-token-mean[ PPO(A) ],  ratio = pi_w^new / pi_w^old (1 with one update per step)
# Gradient on the last loop's logits: (1 + w) A (e_y - pi_w), with no 1 / (1 + w) normalization
# (user 2026-11-19; with a fixed w the constant factor is largely cancelled by AdamW and the
# grad-norm clip, so the shared learning rate 1e-6 is kept). The first loop is
# stop-gradient (ref_grad false): with a gradient, a positive advantage would lower the sampled
# token at loop 1 and improve pi_w by weakening the reference. extrap.omega=0 is GRPO on this code
# path. The aggregation is GRPO's (seq-mean-token-mean), so omega=0 matches the GRPO config's loss
# (the per-loop padded forward differs numerically from verl's remove-padding path).
#
# What the launcher adds (config.add_extrap_overrides, not visible here): the vLLM rollout imports
# rltt_baseline.vllm_loop_cd (model.external_lib) and selects OuroLoopCDForCausalLM with the same
# settings (hf_overrides loop_cd_*), without torch.compile and with CUDA graphs for decode batches
# only (compilation_config, as decode_last), and rollout.calculate_log_probs: verl then logs
# training/rollout_probs_diff_* between vLLM's guided log-probs and the actor's log pi_w (should be
# close to 0). Per-step cost: the rollout loses torch.compile; the actor computes two extra
# full-vocabulary lm_head passes (loops 1 and 4) per response position.
#
# LOOPRL_MODEL_DIR must be rebuilt with rltt_baseline.prepare_model (return_extrap_log_probs); the
# switch is off by default, so the other methods are unaffected.
# Monitor: extrap/entropy (entropy of pi_w, also actor/entropy), extrap/log_prob_minus_last_loop,
# rltt/loop_t_entropy and loop_audit (per-loop entropy; pi_w is sharper than P^(4), so watch for
# faster entropy collapse), training/rollout_probs_diff_*.
#
# Data, lengths, optimisation, rollout, audit: identical to the other 1.4B configs (64 prompts x 8
# rollouts, accumulation 1, 100 steps, lr 1e-6 constant + 10% warmup, betas (0.9, 0.99), weight
# decay 0.1, grad clip 0.1, KL off, seed 42, temperature 1, top-p 1).
# Launch: python -m rltt_baseline.launch --config <this file> [dot-list overrides]
# Ablations by override (give each its own wandb.run_name):
#   extrap.omega=0.3                              weaker extrapolation (LoopCD's safe band 0.2-0.3)
#   extrap.adaptive=true extrap.omega=1.0         adaptive strength w (1 - top-2 margin), cap 1.0
#   extrap.margin_alpha=0.5                       position weight 1 + 0.5 (1 - top-2 margin)
#   extrap.ref_grad=true                          gradient through loop 1 (expect contrast hacking)
#   extrap.omega=0                                GRPO on this code path

trainer: rltt

args:  # keys = dest names of the vendor rltt_train.py argparse options
  model_path: ${oc.env:LOOPRL_OURO_DIR}
  use_rltt_model: true
  rltt_model_path: ${oc.env:LOOPRL_MODEL_DIR}        # built by rltt_baseline.prepare_model (1.4B)
  rltt_logprob_chunk_size: 2048
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true
  no_gradient_checkpointing: false
  ref_offload: true

  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048
  max_completion_length: 16384

  # vendor loop weighting is replaced by the extrap section below; this value only keeps the
  # vendor's run name consistent with the PLC configs
  loop_weighting: uniform
  progressive_alpha: 1.0
  beta: 0.0                     # KL off (verl_overrides: use_kl_loss false, kl_loss_coef 0)
  num_generations: 8
  num_prompts_per_batch: 64
  temperature: 1.0

  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: constant
  gradient_accumulation_steps: 1  # one optimizer update per 64-prompt step
  num_train_epochs: 5
  max_steps: 100
  seed: 42

  ppo_max_token_len: 32768      # >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 1
  logging_steps: 1

  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

extrap:
  enabled: true
  omega: 0.5                    # w: pi_w ∝ P^(4) (P^(4) / P^(1))^w; 0 = GRPO
  adaptive: false               # fixed w at every position (LoopCD-Logits, fixed strength)
  ref_loop: 1                   # reference loop (LoopCD: the first loop works best on Ouro)
  ref_grad: false               # loop 1's readout is stop-gradient in pi_w
  margin_alpha: 0.0             # no position weight
  delta_cap: null               # no clip on log P^(4) - log P^(1) (the paper's LoopCD)

loss_agg:
  # GRPO's aggregation (user 2026-11-14 for GRPO): each response averaged over its own tokens,
  # then mean over all responses; omega=0 is then the GRPO config's loss
  mode: seq-mean-token-mean

wandb:
  enabled: true
  mode: online                  # required (AGENTS.md); WANDB_API_KEY comes from env.local
  project: looprl-ouro            # one wandb project for every method and size
  entity: null
  run_name: extrap-grpo-loopcd-w0.5-1p4b
  tags: [extrap, ep-grpo, loopcd, omega-0.5, ouro-1.4b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

verl_overrides:
  data:
    seed: ${args.seed}          # dataloader shuffle seed; verl default null ignores args.seed
    train_batch_size: 64        # prompts per rollout batch -> 64 x 8 = 512 rollouts
  actor_rollout_ref:
    model:
      override_config:
        # HF actor forward = the last loop, the loop vLLM samples from. With the Ouro config's
        # early_exit_threshold 1.0, the official forward takes per token the first loop whose
        # cumulative exit probability reaches 1.0, an earlier loop when bf16 rounds it to 1.
        # Read only by the official forward (GRPO log-probs, RLTT's old_log_probs); the
        # per-loop RLTT / PLC forward and vLLM never use it.
        early_exit_threshold: null
    rollout:
      max_num_batched_tokens: 32768  # vLLM tokens per scheduler step; verl default 8192 is
                                     # below max_model_len 18,432, which verl refuses with
                                     # chunked prefill on (both vendor scripts turn it on)
      # sampling and engine settings written out (verl 0.6.1 defaults, same for every method)
      top_p: 1.0                     # no nucleus truncation
      top_k: -1                      # no top-k truncation
      do_sample: true                # sample at args.temperature, not greedy
      ignore_eos: false              # stop at EOS
      max_num_seqs: 1024             # vLLM concurrent sequences cap
      dtype: bfloat16                # vLLM weights / activations
    actor:
      ppo_mini_batch_size: 64   # = the 64 prompts of one step -> one update per step
      use_kl_loss: false        # KL loss disabled in every config of the comparison groups
      kl_loss_coef: 0.0
      optim:
        betas: [0.9, 0.99]
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]
  trainer:
    logger: [wandb, console]
    max_actor_ckpt_to_keep: 2  # save every step; retain the two latest actor checkpoints

rollout:
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 24         # Ouro-1.4B-Thinking (2.6B: 48); checked against config.json

audit:
  # Per-loop token distributions on every response token (rltt_baseline.loop_audit), written to
  # <output_dir>/audit/step_<step>/. On in every config of the comparison groups (shared key):
  # read-only, no extra forward (hooks the compute_log_prob pass), so the loss is unchanged; it
  # costs an lm_head call per loop on the response tokens and about 220 bytes per token on disk
  # before compression.
  loop_distribution:
    enabled: true
    every_n_steps: 1    # audited steps: 1, 1 + n, 1 + 2n, ...
    top_k: 5
    save_tokens: true   # false keeps summary.json and responses.jsonl, not the per-token arrays
    chunk_tokens: 512   # response tokens per lm_head call; lower it if the audit runs out of memory
    loop_weights: true  # also per-token exit_pdf (n, T) and, in PLC runs, the PLC loop weights
                        # plc_weight (n, T); 16 bytes per token each
