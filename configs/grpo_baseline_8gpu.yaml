# GRPO baseline on Ouro-2.6B-Thinking, one node with 8 GPUs (stage 1 of the loop-gradient study).
# Data and lengths follow SAPD: DeepMath-103K level >= 6 with its own prompt (training uses the
#   14,684-row filtered subset, AGENTS.md rule 1), prompts up to 2,048 tokens, generations up to
#   16,384 tokens.
# Optimisation follows the RLTT paper (Williams & Tureci 2026, arXiv 2602.10520, Table 6), which
# trains GRPO and RLTT with the same settings, and configs/rltt_baseline.yaml (the 2.6B
# comparison group, see CLAUDE.md; test_matched_configs_share_all_non_method_settings):
#   64 prompts x 8 rollouts per step, no gradient accumulation, 100 steps (paper: 32 prompts,
#   accumulation 2, 140 steps; here every step is one update and the 10% warmup = 10), AdamW8bit
#   lr 1e-6 constant + 10% warmup, betas (0.9, 0.99),
#   weight decay 0.1, grad clip 0.1, KL loss off, BF16, binary reward, group-normalised advantage.
# Trainer: RLTT repository grpo_experiments/grpo_train.py = standard verl 0.6.1 GRPO
#   (PPO clip 0.2, token-mean). Ouro runs a fixed 4 loops. The vendor script differs from the
#   paper in four places, fixed in verl_overrides below.
# Launch: python -m rltt_baseline.launch --config <this file> [dot-list overrides]
# Paths come from environment variables (see scripts/prepare_*.sh).

trainer: grpo

args:  # keys = dest names of grpo_train.py argparse options
  # model: directory built by rltt_baseline.prepare_model (official weights + compat edit);
  # grpo_train.py edits <model>/modeling_ouro.py in place, so never point at the official dir.
  model_path: ${oc.env:LOOPRL_MODEL_DIR}
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true

  # data: the 14,684-row merged filtered set (AGENTS.md rule 1; the launcher refuses any other
  # file: SHA256 and row count are checked), a verl parquet whose prompts are used unchanged.
  # MATH-500 for optional validation (vendor conversion, RLTT prompt).
  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048     # SAPD; longer prompts are filtered out
  max_completion_length: 16384 # SAPD

  # GRPO
  use_ppo: false
  num_generations: 8          # rollouts per prompt (group size)
  num_prompts_per_batch: 64   # vendor sets data.train_batch_size = this x num_generations;
                              # the real batch is set explicitly in verl_overrides below
  temperature: 1.0
  beta: 0.0                     # KL off (verl_overrides: use_kl_loss false, kl_loss_coef 0)

  # optimisation
  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1          # vendor only passes this to the (unused) critic; see verl_overrides
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1  # one optimizer update per 64-prompt step (as the 1.4B group)
  num_train_epochs: 5
  max_steps: 100              # paper Table 6; one step = one 64-prompt rollout batch = one update
  seed: 42

  # memory / rollout
  ppo_max_token_len: 32768    # per-GPU token budget; must be >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  # resources and outputs
  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 1               # checkpoints feed the per-loop gradient probe (condition B)
  logging_steps: 1

  # validation (off, as in the RLTT paper runs)
  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

wandb:
  enabled: true
  mode: online                  # required (AGENTS.md); WANDB_API_KEY comes from env.local
  project: looprl-ouro            # one wandb project for every method and size
  entity: null
  run_name: null                # null = vendor name GRPO-<model dir name>
  tags: [grpo, baseline, ouro-2.6b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

verl_overrides:
  data:
    seed: ${args.seed}          # dataloader shuffle seed; verl default null ignores args.seed
    train_batch_size: 64      # prompts per rollout batch -> 64 x 8 = 512 rollouts
  algorithm:
    use_kl_in_reward: false   # vendor GRPO adds KL to the reward; never in the reward here
  actor_rollout_ref:
    model:
      override_config:
        # HF actor forward = the last loop, the loop vLLM samples from. With the Ouro config's
        # early_exit_threshold 1.0, the official forward takes per token the first loop whose
        # cumulative exit probability reaches 1.0, an earlier loop when bf16 rounds it to 1.
        # Read only by the official forward (GRPO log-probs, RLTT's old_log_probs); the
        # per-loop RLTT / PLC forward and vLLM never use it.
        early_exit_threshold: null
    rollout:
      max_num_batched_tokens: 32768  # vLLM tokens per scheduler step; verl default 8192 is
                                     # below max_model_len 18,432, which verl refuses with
                                     # chunked prefill on (both vendor scripts turn it on)
      # sampling and engine settings written out (verl 0.6.1 defaults, same for every method)
      top_p: 1.0                     # no nucleus truncation
      top_k: -1                      # no top-k truncation
      do_sample: true                # sample at args.temperature, not greedy
      ignore_eos: false              # stop at EOS
      max_num_seqs: 1024             # vLLM concurrent sequences cap
      dtype: bfloat16                # vLLM weights / activations
    actor:
      ppo_mini_batch_size: 64 # = the 64 prompts of one step -> one update per step
      grad_clip: 0.1          # vendor leaves the verl default 1.0
      use_kl_loss: false        # KL loss disabled in every config of the comparison groups
      kl_loss_coef: 0.0
      optim:
        betas: [0.9, 0.99]    # paper Table 6; both vendor scripts use (0.9, 0.999)
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]  # hf_model: loadable by the probe
    ref:
      fsdp_config:
        param_offload: true   # RLTT ref_offload
  trainer:
    logger: [wandb, console]

rollout:
  # full: stock vLLM (one KV cache per loop). decode_last: prompts keep every loop's KV,
  # generated tokens keep only the last loop's (rltt_baseline.vllm_decode_last); verl then also
  # logs the rollout / training log-prob mismatch. Training forwards always use the full KV.
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 48       # Ouro-2.6B-Thinking (1.4B: 24); checked against config.json

audit:
  # Per-loop token distributions on every response token (rltt_baseline.loop_audit), written to
  # <output_dir>/audit/step_<step>/. On in every config of the comparison groups (shared key):
  # read-only, no extra forward (hooks the compute_log_prob pass), so the loss is unchanged; it
  # costs an lm_head call per loop on the response tokens and about 220 bytes per token on disk
  # before compression.
  loop_distribution:
    enabled: true
    every_n_steps: 1    # audited steps: 1, 1 + n, 1 + 2n, ...
    top_k: 5
    save_tokens: true   # false keeps summary.json and responses.jsonl, not the per-token arrays
    chunk_tokens: 512   # response tokens per lm_head call; lower it if the audit runs out of memory
    loop_weights: true  # also per-token exit_pdf (n, T) and, in PLC runs, the PLC loop weights
                        # plc_weight (n, T); 16 bytes per token each
