# PLC on Ouro-1.4B-Thinking: GRPO on the final loop; the earlier loops learn off-policy from the
# same rollouts with the exact (uncapped) cross-loop importance ratio, and are anchored to their
# own distribution in the frozen initial model instead of being pulled towards the final loop.
# One node with 8 GPUs, one optimizer update per step. Saved 2026-11-13 at the user's request
# ("0.1 weight, no upper bound on the importance ratio, plus a KL constraint to the reference").
# It differs from grpo_baseline_1p4b_8gpu.yaml, rltt_baseline_1p4b_8gpu.yaml and
# plc_grpo_loopaux_1p4b_8gpu.yaml only in the method (tests/test_rltt_baseline.py and
# tests/test_plc.py check this). No 2.6B copy.
#
# Why: the loop-aux run (trunc_cap 1, k1 towards the final loop) collapses the earlier loops'
# entropy. Two of its parts push loop t towards the final loop's sharp distribution: the cap, which
# makes the advantage-independent drift Abar(s) (m - |m| p) non-zero with m ~ min(P^(t), P^(T))
# (research/plc_entropy_design_2026-11-13.md, section 2; the exact ratio has no such drift), and
# the k1 term, whose fixed point is P^(t) = P^(T). Here the ratio is exact and the k1 term is
# replaced by an anchor whose fixed point is loop t's own initial distribution.
#
# Objective (rltt_baseline.plc.plc_policy_loss):
#   loss = -token-mean[ PPO^(T)(A) ]                                        (GRPO, unchanged)
#          + lam * sum_{t<T} alpha_t * ( -token-mean[ rho[j,t] PPO^(t)(A) ]       (surrogate)
#                                        + init_kl_coef * token-mean[ pen[j,t] ] ) (anchor)
#   rho[j,t] = P_old^(t)(y_j) / P_old^(T)(y_j)        exact, stop-gradient (trunc_cap = .inf)
#   pen[j,t] = r - 1 - log r,  r = P_init^(t)(y_j) / P^(t)(y_j)   (init_kl_form k3, verl's
#              low_var_kl with the frozen initial model as reference; linear beyond
#              |log r| > init_kl_log_ratio_cap = 3, so the gradient stays bounded)
#   alpha_t  = 1/3, lam = 0.1, init_kl_coef = 0.1 (anchor strength lam * init_kl_coef = 0.01)
# With one update per step the per-token gradient on loop t is
# -(lam / N) alpha_t (rho A - init_kl_coef (1 - P_init^(t)/P^(t))) d log P^(t)(y_j).
# k3 rather than k3_reverse: without the cap the collapse lowers the tail tokens, and k3 is the
# form that resists lowering (unbounded slope there, at most 1 on raised tokens). init_kl_coef
# 0.1: in the population toy (scratchpad nocap_anchor.py) 300 uncapped steps take the entropy
# from 3.76 to 0.35 without an anchor, 1.17 with k3 0.1 (learning signal -15%), 1.45 with 0.2.
# A toy only; scan by override. The frozen initial model is loaded by the PLC actor worker
# (same LOOPRL_MODEL_DIR, CPU-offloaded, one extra per-loop forward per step, never reloaded from
# a checkpoint): the dry-run's reference_policy starts with "plc anchor", and the step time is not
# comparable with GRPO / RLTT. verl's own KL loss stays off (shared setting).
# Risk: the exact ratio is unbounded (rho up to 1 / P^(T)(y) on rare sampled tokens); watch
# plc/xloop_pg_weight_abs_mean/loop_t, plc/xloop_rho_bar_mean/loop_t and actor/grad_norm (grad
# clip 0.1 is global). Monitor the anchor with plc/init_pen|init_log_ratio|init_beyond_cap_frac.
#
# Data and lengths follow SAPD (DeepMath-103K level >= 6, prompts <= 2,048, generations <= 16,384)
# like the other configs here; training uses only the 14,684-row merged filtered subset
# (AGENTS.md rule 1), and the launcher refuses any other training file.
# Optimisation follows RLTT Table 6 apart from batch and length of run: 64 prompts x 8 rollouts
# per step, accumulation 1, 100 steps = 100 updates (paper: 32 prompts, accumulation 2, 140
# steps); lr 1e-6 constant + 10% warmup, betas (0.9, 0.99),
# weight decay 0.1, grad clip 0.1, KL loss off, BF16, binary reward, group-normalised advantage.
# Launch: python -m rltt_baseline.launch --config <this file> [dot-list overrides]
# Ablations by override (give each its own wandb.run_name):
#   plc.init_kl_coef=0.05 / 0.2 / 0.5            anchor strength
#   plc.init_kl_form=k3_reverse / k2              anchor form
#   plc.init_kl_coef=0                            exact ratio alone, no anchor
#   plc.kl_coef=0.2                               also keep the loop-aux k1 term
#   plc.trunc_cap=1                               the loop-aux cap, with the anchor

trainer: rltt

args:  # keys = dest names of the vendor rltt_train.py argparse options
  model_path: ${oc.env:LOOPRL_OURO_DIR}
  use_rltt_model: true
  rltt_model_path: ${oc.env:LOOPRL_MODEL_DIR}        # built by rltt_baseline.prepare_model (1.4B)
  rltt_logprob_chunk_size: 2048
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true
  no_gradient_checkpointing: false
  ref_offload: true

  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048
  max_completion_length: 16384

  # vendor loop weighting is replaced by the plc section below; this value only keeps the
  # vendor's run name and logging consistent with the uniform prior used here
  loop_weighting: uniform
  progressive_alpha: 1.0
  beta: 0.0                     # KL off (verl_overrides: use_kl_loss false, kl_loss_coef 0)
  num_generations: 8
  num_prompts_per_batch: 64
  temperature: 1.0

  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: constant
  gradient_accumulation_steps: 1  # one optimizer update per 64-prompt step
  num_train_epochs: 5
  max_steps: 100
  seed: 42

  ppo_max_token_len: 32768      # >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 1
  logging_steps: 1

  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

plc:
  enabled: true
  weight_mode: is_trunc         # alpha_t * min(c, P^(t)/P^(T)) for t < T, 0 for the final loop;
                                # alpha_t = 1/3 (uniform over the earlier loops)
  lam: 0.1                      # earlier-loop term coefficient (GRPO term unscaled); 0 = GRPO
  trunc_cap: .inf               # no upper cap: the exact cross-loop ratio P^(t)/P^(T)
  kl_coef: 0.0                  # no k1 term towards the final loop (replaced by the anchor)
  log_weight_stats: true
  init_kl_coef: 0.1             # anchor to the frozen initial model; strength lam * 0.1
  init_kl_form: k3              # r - 1 - log r, r = P_init^(t) / P^(t) (verl low_var_kl form)
  init_kl_log_ratio_cap: 3.0    # |log r| beyond which the penalty continues linearly

loss_agg:
  # Dr. GRPO aggregation (user 2026-11-14): every loss term = sum over response tokens /
  # (rows x norm_len), independent of the micro-batch split and of response lengths
  mode: drgrpo
  norm_len: 16384               # the constant M of Dr. GRPO (= max_completion_length)

wandb:
  enabled: true
  mode: online                  # required (AGENTS.md); WANDB_API_KEY comes from env.local
  project: looprl-ouro            # one wandb project for every method and size
  entity: null
  run_name: plc-grpo-loopaux-nocap-refkl-1p4b
  tags: [plc, grpo-loopaux, exact-ratio, init-anchor-k3, no-gate-loss, ouro-1.4b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

verl_overrides:
  data:
    seed: ${args.seed}          # dataloader shuffle seed; verl default null ignores args.seed
    train_batch_size: 64        # prompts per rollout batch -> 64 x 8 = 512 rollouts
  actor_rollout_ref:
    model:
      override_config:
        # HF actor forward = the last loop, the loop vLLM samples from. With the Ouro config's
        # early_exit_threshold 1.0, the official forward takes per token the first loop whose
        # cumulative exit probability reaches 1.0, an earlier loop when bf16 rounds it to 1.
        # Read only by the official forward (GRPO log-probs, RLTT's old_log_probs); the
        # per-loop RLTT / PLC forward and vLLM never use it.
        early_exit_threshold: null
    rollout:
      max_num_batched_tokens: 32768  # vLLM tokens per scheduler step; verl default 8192 is
                                     # below max_model_len 18,432, which verl refuses with
                                     # chunked prefill on (both vendor scripts turn it on)
      # sampling and engine settings written out (verl 0.6.1 defaults, same for every method)
      top_p: 1.0                     # no nucleus truncation
      top_k: -1                      # no top-k truncation
      do_sample: true                # sample at args.temperature, not greedy
      ignore_eos: false              # stop at EOS
      max_num_seqs: 1024             # vLLM concurrent sequences cap
      dtype: bfloat16                # vLLM weights / activations
    actor:
      ppo_mini_batch_size: 64   # = the 64 prompts of one step -> one update per step
      use_kl_loss: false        # KL loss disabled in every config of the comparison groups
      kl_loss_coef: 0.0
      optim:
        betas: [0.9, 0.99]
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]
  trainer:
    logger: [wandb, console]

rollout:
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 24         # Ouro-1.4B-Thinking (2.6B: 48); checked against config.json

audit:
  # Per-loop token distributions on every response token (rltt_baseline.loop_audit), written to
  # <output_dir>/audit/step_<step>/. On in every config of the comparison groups (shared key):
  # read-only, no extra forward (hooks the compute_log_prob pass), so the loss is unchanged; it
  # costs an lm_head call per loop on the response tokens and about 220 bytes per token on disk
  # before compression.
  loop_distribution:
    enabled: true
    every_n_steps: 1    # audited steps: 1, 1 + n, 1 + 2n, ...
    top_k: 5
    save_tokens: true   # false keeps summary.json and responses.jsonl, not the per-token arrays
    chunk_tokens: 512   # response tokens per lm_head call; lower it if the audit runs out of memory
    loop_weights: true  # also per-token exit_pdf (n, T) and, in PLC runs, the PLC loop weights
                        # plc_weight (n, T); 16 bytes per token each
