# GRPO + loop auxiliary term on Ouro-1.4B-Thinking (PLC code path): the final loop is trained by
# GRPO unchanged, plus lam = 0.1 times a corrected per-loop term on the earlier loops; no gate loss.
# One node with 8 GPUs, one optimizer update per step. Method config in the 1.4B comparison group
# (see CLAUDE.md), saved as its own file at the user's request (2026-11-08): it is
# plc_posterior_exit_nogate_1p4b_8gpu.yaml with the plc keys weight_mode, prior, lam, objective,
# loop_baseline and loop_agg_mode changed (args.loop_weighting uniform to match, which only names
# the vendor run) and its own wandb run name / tags; every other key is the same, so the run
# differs from grpo_baseline_1p4b_8gpu.yaml only in the method (tests/test_rltt_baseline.py and
# tests/test_plc.py check this). No 2.6B copy.
#
# Why: the RLTT run r50a17c3 sharpened loop 1 (entropy 1.65 -> 0.36) and, through the shared
# weights, the final loop (0.50 -> 0.37), with no accuracy gain over GRPO (g79f2224). The loop
# audit diagnostics (rltt_baseline.diagnostics.gate_push) trace it to three things, each handled
# by one part of the loss below:
#   P1 loop t is trained on tokens sampled by loop T     -> truncated importance weight rho
#   P2 the advantage mass is not zero (token-mean x longer wrong answers: 55.8% negative)
#                                                        -> per-group, per-loop baseline b and
#                                                           seq-mean-token-mean for the loop term
#   P3 the exit gate sits in the gradient path           -> fixed alpha, no exit_pdf, no gate loss
#
# Objective (rltt_baseline.plc, objective additive):
#   loss = -token-mean[ PPO^(T)(A) ]                                        (GRPO, unchanged)
#          - lam * seq-mean token-mean[ sum_{t<T} alpha_t rho[j,t] PPO^(t)(A - b[g,t]) ]
#   rho[j,t] = min(1, P_old^(t)(y_j) / P_old^(T)(y_j)),  alpha_t = 1/3 (uniform prior on t < T)
#   b[g,t]   = sum_{i in g} A_i m[i,t] / sum_{i in g} m[i,t],  m[i,t] = token mean of alpha_t rho
# lam = 0 is exactly GRPO's loss on this (padded, per-loop) forward. PPO^(t) uses loop t's own
# ratio and verl's clip (0.2, dual clip 3), like the final loop. The gate gets no gradient; it can
# still move because the hidden states it reads change (as in GRPO). KL loss is disabled.
# Same LOOPRL_MODEL_DIR as the other 1.4B configs.
#
# Data and lengths follow SAPD (DeepMath-103K level >= 6, prompts <= 2,048, generations <= 16,384)
# like the other configs here; training uses only the 14,684-row merged filtered subset
# (AGENTS.md rule 1), and the launcher refuses any other training file.
# Optimisation follows RLTT Table 6 apart from batch and length of run: 64 prompts x 8 rollouts
# per step, accumulation 1, 100 steps = 100 updates (paper: 32 prompts, accumulation 2, 140
# steps); lr 1e-6 constant + 10% warmup, betas (0.9, 0.99),
# weight decay 0.1, grad clip 0.1, KL loss off, BF16, binary reward, group-normalised advantage.
# Launch: python -m rltt_baseline.launch --config <this file> [dot-list overrides]
# Ablations by override (give each its own wandb.run_name):
#   plc.lam=0.3                                   stronger loop term
#   plc.loop_baseline=none                        sampling correction only (P2 left in)
#   plc.weight_mode=early_prior                   baseline only, no rho (P1 left in)
#   plc.lam=0                                     GRPO on the PLC code path

trainer: rltt

args:  # keys = dest names of the vendor rltt_train.py argparse options
  model_path: ${oc.env:LOOPRL_OURO_DIR}
  use_rltt_model: true
  rltt_model_path: ${oc.env:LOOPRL_MODEL_DIR}        # built by rltt_baseline.prepare_model (1.4B)
  rltt_logprob_chunk_size: 2048
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true
  no_gradient_checkpointing: false
  ref_offload: true

  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048
  max_completion_length: 16384

  # vendor loop weighting is replaced by the plc section below; this value only keeps the
  # vendor's run name and logging consistent with the uniform prior used here
  loop_weighting: uniform
  progressive_alpha: 1.0
  beta: 0.0                     # KL off (verl_overrides: use_kl_loss false, kl_loss_coef 0)
  num_generations: 8
  num_prompts_per_batch: 64
  temperature: 1.0

  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: constant
  gradient_accumulation_steps: 1  # one optimizer update per 64-prompt step
  num_train_epochs: 5
  max_steps: 100
  seed: 42

  ppo_max_token_len: 32768      # >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 1
  logging_steps: 1

  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

plc:
  enabled: true
  weight_mode: is_trunc         # alpha_t * min(1, P^(t)/P^(T)) for t < T, 0 for the final loop
  prior: uniform                # alpha = the prior on t < T, renormalised: 1/3 each
  progressive_alpha: 1.0
  gamma: 1.0                    # unused by is_trunc
  lam: 0.1                      # loop term coefficient; 0 = GRPO
  objective: additive           # GRPO term unchanged (not scaled by 1 - lam) + lam * loop term
  loop_baseline: group          # per-group, per-loop baseline: zero weighted advantage mass
  loop_agg_mode: seq-mean-token-mean  # loop term only; the GRPO term keeps token-mean
  eps_floor: 0.0
  use_gate_loss: false          # needs prior: exit
  gate_coef: 1.0
  gate_entropy_coef: 0.05       # unused without the gate loss
  use_is_correction: false      # is_trunc already is the importance weight
  is_clip: 5.0
  log_weight_stats: true

wandb:
  enabled: true
  mode: online                  # required (AGENTS.md); WANDB_API_KEY comes from env.local
  project: looprl-ouro            # one wandb project for every method and size
  entity: null
  run_name: plc-grpo-loopaux-1p4b
  tags: [plc, grpo-loopaux, is-trunc, group-baseline, no-gate-loss, ouro-1.4b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

verl_overrides:
  data:
    seed: ${args.seed}          # dataloader shuffle seed; verl default null ignores args.seed
    train_batch_size: 64        # prompts per rollout batch -> 64 x 8 = 512 rollouts
  actor_rollout_ref:
    rollout:
      max_num_batched_tokens: 32768  # vLLM tokens per scheduler step; verl default 8192 is
                                     # below max_model_len 18,432, which verl refuses with
                                     # chunked prefill on (both vendor scripts turn it on)
      # sampling and engine settings written out (verl 0.6.1 defaults, same for every method)
      top_p: 1.0                     # no nucleus truncation
      top_k: -1                      # no top-k truncation
      do_sample: true                # sample at args.temperature, not greedy
      ignore_eos: false              # stop at EOS
      max_num_seqs: 1024             # vLLM concurrent sequences cap
      dtype: bfloat16                # vLLM weights / activations
    actor:
      ppo_mini_batch_size: 64   # = the 64 prompts of one step -> one update per step
      use_kl_loss: false        # KL loss disabled in every config of the comparison groups
      kl_loss_coef: 0.0
      optim:
        betas: [0.9, 0.99]
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]
  trainer:
    logger: [wandb, console]

rollout:
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 24         # Ouro-1.4B-Thinking (2.6B: 48); checked against config.json

audit:
  # Per-loop token distributions on every response token (rltt_baseline.loop_audit), written to
  # <output_dir>/audit/step_<step>/. On in every config of the comparison groups (shared key):
  # read-only, no extra forward (hooks the compute_log_prob pass), so the loss is unchanged; it
  # costs an lm_head call per loop on the response tokens and about 220 bytes per token on disk
  # before compression.
  loop_distribution:
    enabled: true
    every_n_steps: 1    # audited steps: 1, 1 + n, 1 + 2n, ...
    top_k: 5
    save_tokens: true   # false keeps summary.json and responses.jsonl, not the per-token arrays
    chunk_tokens: 512   # response tokens per lm_head call; lower it if the audit runs out of memory
    loop_weights: true  # also per-token exit_pdf (n, T) and, in PLC runs, the PLC loop weights
                        # plc_weight (n, T); 16 bytes per token each
