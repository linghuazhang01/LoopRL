# GRPO on Ouro-1.4B-Thinking, one node with 8 GPUs, 16K generations, one optimizer update per step.
# Differs from grpo_baseline_8gpu.yaml (Ouro-2.6B-Thinking) in two ways:
# - the model (the RLTT paper trains both sizes with the same settings);
# - no gradient accumulation: every 32-prompt step (256 rollouts) is one optimizer update, so the
#   140 steps are 140 updates and the 10% warmup is 14 updates (2.6B: accumulation 2, 64 prompts
#   per update, 70 updates).
# Everything else is the same. Data and lengths follow SAPD: DeepMath-103K level >= 6 (57,046
#   problems) with its own prompt, prompts up to 2,048 tokens, generations up to 16,384 tokens.
# Optimisation follows the RLTT paper (Williams & Tureci 2026, arXiv 2602.10520, Table 6) apart
#   from the accumulation: 140 steps, AdamW8bit lr 1e-6 constant + 10% warmup, betas (0.9, 0.99),
#   weight decay 0.1, grad clip 0.1, KL 1e-3, BF16, binary reward, group-normalised advantage.
# Memory settings are kept; with 24 layers x 4 loops the KV cache is about 0.79 MB per token, half
#   of the 2.6B model's.
# Trainer: RLTT repository grpo_experiments/grpo_train.py = standard verl 0.6.1 GRPO
#   (PPO clip 0.2, token-mean, one epoch). Ouro runs a fixed 4 loops. The vendor script differs
#   from the paper in four places, fixed in verl_overrides below.
# Model directory: `bash scripts/prepare_model.sh <models dir> --model 1.4B` builds
#   <models dir>/Ouro-1.4B-Thinking-RLTT; pass it as LOOPRL_MODEL_DIR. model.num_hidden_layers
#   (bottom) makes the launcher refuse a 2.6B directory.
# Launch: python -m rltt_baseline.launch --config <this file> [dot-list overrides]
# Paths come from environment variables (see scripts/prepare_*.sh).

trainer: grpo

args:  # keys = dest names of grpo_train.py argparse options
  # model: Ouro-1.4B-Thinking dir built by rltt_baseline.prepare_model (official weights + compat
  # edit);
  # grpo_train.py edits <model>/modeling_ouro.py in place, so never point at the official dir.
  model_path: ${oc.env:LOOPRL_MODEL_DIR}
  total_ut_steps: 4
  no_lora: true
  no_sft_checkpoint: true

  # data: SAPD math training set (deepmath_level6.parquet from scripts/prepare_data.sh), a verl
  # parquet whose prompts are used unchanged; a MATH JSONL instead gets the RLTT prompt.
  # MATH-500 for optional validation (vendor conversion, RLTT prompt).
  train_file: ${oc.env:LOOPRL_TRAIN_FILE}
  math500_test_file: ${oc.env:LOOPRL_MATH500_JSONL}
  max_prompt_length: 2048     # SAPD; longer prompts are filtered out
  max_completion_length: 16384 # SAPD

  # GRPO
  use_ppo: false
  num_generations: 8          # rollouts per prompt (group size)
  num_prompts_per_batch: 32   # vendor sets data.train_batch_size = this x num_generations;
                              # the real batch is set explicitly in verl_overrides below
  temperature: 1.0
  beta: 0.001                 # KL coefficient (applied as a loss term, see verl_overrides)

  # optimisation
  learning_rate: 1.0e-6
  weight_decay: 0.1
  max_grad_norm: 0.1          # vendor only passes this to the (unused) critic; see verl_overrides
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1  # one optimizer update per step (2.6B config: 2)
  num_train_epochs: 5
  max_steps: 140              # paper Table 6; one step = one 32-prompt rollout batch = one update
  seed: 42

  # memory / rollout
  ppo_max_token_len: 32768    # per-GPU token budget; must be >= prompt + generation (18,432)
  log_prob_max_token_len: 32768
  dataloader_num_workers: 4
  use_vllm: true
  no_vllm: false
  vllm_gpu_memory_utilization: 0.45
  vllm_tensor_parallel_size: 1
  vllm_enforce_eager: false

  # resources and outputs
  n_gpus: 8
  nnodes: 1
  output_dir: ${oc.env:LOOPRL_OUTPUT_DIR}
  save_steps: 10              # checkpoints feed the per-loop gradient probe (condition B)
  logging_steps: 1

  # validation (off, as in the RLTT paper runs)
  no_validation: true
  skip_initial_validation: true
  eval_steps: 5
  val_batch_size: 64
  val_max_new_tokens: 16384

wandb:
  enabled: true
  mode: offline
  project: looprl-grpo-ouro
  run_name: null
  tags: [grpo, baseline, ouro-1.4b-thinking, deepmath-level6]
  notes: null
  dir: ${args.output_dir}

verl_overrides:
  data:
    train_batch_size: 32      # prompts per rollout batch -> 32 x 8 = 256 rollouts
  algorithm:
    use_kl_in_reward: false   # vendor GRPO adds KL to the reward; RLTT uses a KL loss
  actor_rollout_ref:
    actor:
      ppo_mini_batch_size: 32 # = the 32 prompts of one step -> one update per step
      grad_clip: 0.1          # vendor leaves the verl default 1.0
      use_kl_loss: true       # low_var_kl, coefficient args.beta (as in RLTT)
      optim:
        betas: [0.9, 0.99]    # paper Table 6; both vendor scripts use (0.9, 0.999)
      checkpoint:
        save_contents: [model, optimizer, extra, hf_model]  # hf_model: loadable by the probe
    ref:
      fsdp_config:
        param_offload: true   # RLTT ref_offload
  trainer:
    logger: [wandb, console]

rollout:
  # full: stock vLLM (one KV cache per loop). decode_last: prompts keep every loop's KV,
  # generated tokens keep only the last loop's (rltt_baseline.vllm_decode_last); verl then also
  # logs the rollout / training log-prob mismatch. Training forwards always use the full KV.
  kv_layout: full

env:
  TOKENIZERS_PARALLELISM: "false"

model:
  num_hidden_layers: 24       # Ouro-1.4B-Thinking (2.6B: 48); checked against config.json
