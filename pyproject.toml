[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looprl"
version = "0.1.0"
description = "RL on looped language models; RLTT baseline on Ouro"
requires-python = ">=3.10"
dependencies = ["omegaconf>=2.3", "pyyaml>=6", "numpy", "torch"]

[project.optional-dependencies]
train = ["verl==0.6.1", "vllm==0.12.0", "transformers==4.57.3", "ray", "wandb"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["rltt_baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I"]
